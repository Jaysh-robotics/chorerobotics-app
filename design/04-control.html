<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChoreRobotics — Control (Landscape)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .landscape-frame {
      width: 852px;
      height: 393px;
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin: 20px auto;
      border-radius: 40px;
      border: 2px solid var(--border-color);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .ls-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 24px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .ls-main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .ls-left {
      flex: 0 0 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border-right: 1px solid var(--border-color);
    }

    .ls-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      gap: 8px;
    }

    .ls-right {
      flex: 0 0 220px;
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
      gap: 8px;
      border-left: 1px solid var(--border-color);
    }

    .ls-estop {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 48px;
      background: var(--accent-red);
      border: 3px solid #FFD600;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 800;
      color: white;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 0 24px rgba(255, 59, 48, 0.5), 0 0 0 1px rgba(255, 214, 0, 0.3), 0 4px 12px rgba(0, 0, 0, 0.4);
      z-index: 100;
    }

    .motor-grid-ls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      width: 100%;
    }

    .motor-cell {
      background: var(--bg-surface);
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      text-align: center;
    }
  </style>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body style="background: #050608; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

<div class="landscape-frame">
  <!-- Top Bar -->
  <div class="ls-top-bar">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="connection-status">
        <div class="connection-dot"></div>
        <span class="connection-label">Local</span>
      </div>
      <span class="badge badge-purple" style="font-size: 10px; padding: 2px 8px;">MANUAL</span>
    </div>

    <!-- Speed / Heading center -->
    <div style="display: flex; align-items: center; gap: 24px;">
      <div style="text-align: center;">
        <div style="font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;">Speed</div>
        <div style="font-size: 22px; font-weight: 800; font-family: var(--font-mono); letter-spacing: -1px; line-height: 1;">0.8<span style="font-size: 11px; color: var(--text-muted); font-weight: 500;"> m/s</span></div>
      </div>
      <div style="width: 1px; height: 28px; background: var(--border-color);"></div>
      <div style="text-align: center;">
        <div style="font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;">Heading</div>
        <div style="font-size: 22px; font-weight: 800; font-family: var(--font-mono); letter-spacing: -1px; line-height: 1;">045<span style="font-size: 11px; color: var(--text-muted); font-weight: 500;">°</span></div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--accent-blue)"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
      <span style="font-size: 13px; font-weight: 600; color: var(--accent-blue);">78%</span>
    </div>
  </div>

  <!-- Main Content -->
  <div class="ls-main">
    <!-- Left: Joystick -->
    <div class="ls-left">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div class="joystick-area" style="width: 180px; height: 180px;">
          <div class="joystick-crosshair"></div>
          <div class="joystick-thumb" style="transform: translate(20px, -25px);"></div>
        </div>
        <div style="font-size: 10px; color: var(--text-muted);">DRIVE</div>
      </div>
    </div>

    <!-- Center: Compass + Motors -->
    <div class="ls-center">
      <!-- Compass -->
      <div style="width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--border-color); background: var(--bg-surface); position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <div style="font-size: 9px; color: var(--text-muted); position: absolute; top: 6px;">N</div>
        <div style="font-size: 9px; color: var(--text-muted); position: absolute; bottom: 6px;">S</div>
        <div style="font-size: 9px; color: var(--text-muted); position: absolute; left: 8px;">W</div>
        <div style="font-size: 9px; color: var(--text-muted); position: absolute; right: 8px;">E</div>
        <div style="width: 3px; height: 30px; background: linear-gradient(to top, transparent, var(--accent-blue)); border-radius: 2px; transform: rotate(45deg); transform-origin: bottom center;"></div>
        <div style="width: 10px; height: 10px; border-radius: 50%; background: var(--accent-blue); position: absolute; box-shadow: 0 0 8px var(--accent-blue);"></div>
      </div>

      <!-- Motor speeds -->
      <div class="motor-grid-ls">
        <div class="motor-cell">
          <div style="font-size: 9px; color: var(--text-muted);">FL</div>
          <div style="font-size: 14px; font-weight: 700; font-family: var(--font-mono); color: var(--accent-purple);">0.8</div>
        </div>
        <div class="motor-cell">
          <div style="font-size: 9px; color: var(--text-muted);">FR</div>
          <div style="font-size: 14px; font-weight: 700; font-family: var(--font-mono); color: var(--accent-purple);">0.7</div>
        </div>
        <div class="motor-cell">
          <div style="font-size: 9px; color: var(--text-muted);">RL</div>
          <div style="font-size: 14px; font-weight: 700; font-family: var(--font-mono); color: var(--accent-purple);">0.8</div>
        </div>
        <div class="motor-cell">
          <div style="font-size: 9px; color: var(--text-muted);">RR</div>
          <div style="font-size: 14px; font-weight: 700; font-family: var(--font-mono); color: var(--accent-purple);">0.7</div>
        </div>
      </div>
    </div>

    <!-- Right: Controls -->
    <div class="ls-right">
      <!-- Blade toggle -->
      <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 10px 12px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 16px;">🔪</span>
          <div>
            <div style="font-size: 12px; font-weight: 600;">Blade</div>
            <div style="font-size: 10px; color: var(--text-muted);">OFF</div>
          </div>
        </div>
        <div style="width: 44px; height: 24px; border-radius: 12px; background: var(--bg-surface); border: 1px solid var(--border-color); position: relative;">
          <div style="width: 18px; height: 18px; border-radius: 50%; background: var(--text-muted); position: absolute; top: 2px; left: 3px;"></div>
        </div>
      </div>

      <!-- Action buttons -->
      <button class="btn btn-blue btn-sm" style="font-size: 13px; padding: 12px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Auto Mode
      </button>

      <button class="btn btn-blue btn-sm" style="font-size: 13px; padding: 12px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Return to Dock
      </button>

      <button class="btn btn-purple btn-sm" style="font-size: 13px; padding: 12px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        Pause
      </button>
    </div>
  </div>

  <!-- E-Stop -->
  <div class="ls-estop">
    <div class="estop-pulse"></div>
    EMERGENCY STOP
  </div>
</div>

</body>
</html>
